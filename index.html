<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dimension Sandbox</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game"></div>

    <div id="crosshair">+</div>

    <div id="info">
        <b>DIMENSION SANDBOX</b><br><br>

        WASD — Move<br>
        SPACE — Jump<br>
        Mouse — Look<br>
        Left Click — Break<br>
        Right Click — Place<br>
        ESC — Release Mouse<br><br>

        1 — 1D<br>
        2 — 2D<br>
        3 — 3D<br>
        4 — 4D<br>
        5 — 5D<br>
        6 — 6D
    </div>

    <div id="dimension">
        3D
    </div>

    <div id="message">
        Click to play
    </div>

    <script type="module" src="game.js"></script>

</body>
</html>
